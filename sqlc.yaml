version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/query.sql"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
  - engine: "sqlite"
    queries: "internal/structure/stdb/query.sql"
    schema: "internal/structure/stdb/schema.sql"
    gen:
      go:
        package: "stdb"
        out: "internal/structure/stdb"
