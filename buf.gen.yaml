version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: ax-distiller/proto
plugins:
  - local: protoc-gen-go
    out: proto
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: proto
    opt: paths=source_relative
  - local: protoc-gen-es
    out: proto
inputs:
  - directory: proto
